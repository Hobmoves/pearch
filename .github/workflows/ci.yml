name: CI

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'assets/**', 'docs/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (MSVC)
            os: windows-latest
            preset: release
          - name: Linux (GCC, sanitizers)
            os: ubuntu-latest
            preset: asan
          - name: macOS (Clang)
            os: macos-latest
            preset: release
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Test the SSE2 path (AVX2 off)
        if: runner.os != 'macOS'
        env:
          PEARCH_NO_AVX2: '1'
        run: ctest --preset ${{ matrix.preset }}

      - name: Smoke test
        shell: bash
        run: |
          exe=$(find build/${{ matrix.preset }} -type f \( -name pearch.exe -o -name pearch \) | head -1)
          echo "binary: $exe"
          "$exe" --version
          export PEARCH_HOME="$RUNNER_TEMP/pearch-home"
          mkdir -p "$PEARCH_HOME"
          root=$(pwd -W 2>/dev/null || pwd)   # Windows path under Git Bash
          printf '[locations]\n%s\n' "$root" > "$PEARCH_HOME/config.ini"
          "$exe" index
          "$exe" -l searcher.cpp | tee hits.txt
          grep -q searcher.cpp hits.txt
          "$exe" stats
          "$exe" tour > /dev/null

      - name: Benchmark
        if: matrix.preset == 'release'
        shell: bash
        run: |
          bench=$(find build/release -type f \( -name pearch_bench.exe -o -name pearch_bench \) | head -1)
          "$bench" -n 500000

      - name: Upload binary
        if: matrix.preset == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: pearch-${{ runner.os }}
          path: |
            build/release/**/pearch.exe
            build/release/pearch
          if-no-files-found: error
